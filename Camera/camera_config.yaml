%YAML:1.0
---
camera:
  device_index: 0
  width: 1440
  height: 1080
  exposure_time: 3500.0
  gain: 9.0
  grab_timeout_ms: 100
  acquisition_frame_rate_enable: 0
  adc_bit_depth: 12
  bayer_quality: 0
  window_name: "Hikrobot Camera"
  record_seconds: 60.0

# 视觉管线（docs/海康相机目标识别接入方案.md §8）。
# enabled: 1 时启用传统圆灯检测；0 时保持纯取流。
vision:
  enabled: 1
  backend: "traditional"
  calibration:
    enabled: 1
    file: "../camera_intrinsics.yaml" # relative to this config, not process cwd
  green_light:
    hue_min: 35
    hue_max: 85
    saturation_min: 60
    value_min: 160
    min_area_px: 8.0
    max_area_px: 100000.0
    min_circularity: 0.65
    min_axis_ratio: 0.65
  enable_tracker: 1
  prediction_horizon_seconds: 5.0
  max_prediction_seconds: 10.0
  lost_timeout_ms: 250
  min_confirm_frames: 3
  enable_serial: 0
  serial_port: ""
  serial_baud: 115200
  serial_period_ms: 50
  serial_max_age_ms: 500
  yaw_aim_offset_px: 0.0 # target line = original image centre + offset; right positive
